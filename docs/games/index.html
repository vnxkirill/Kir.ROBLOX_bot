<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KiRoblox Игры</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg1: #12141d;
    --bg2: #1c2030;
    --card: #232840;
    --accent: #e2241d;
    --accent2: #00a2ff;
    --text: #f2f4ff;
    --muted: #8b92b0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, var(--bg2), var(--bg1));
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .logo .ki { color: var(--accent); }
  .logo .roblox { color: var(--text); }
  .tagline { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .grid {
    width: 100%;
    max-width: 420px;
    display: grid;
    gap: 16px;
  }
  .card {
    position: relative;
    display: block;
    text-decoration: none;
    color: var(--text);
    background: linear-gradient(160deg, var(--card), #1a1e33);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 20px;
    padding: 20px;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:active { transform: scale(0.97); }
  .card .glow {
    position: absolute;
    inset: -40% -20% auto;
    height: 120px;
    filter: blur(48px);
    opacity: 0.55;
    pointer-events: none;
  }
  .card.runner .glow { background: var(--accent2); }
  .card.fnf .glow { background: #a23cf5; }
  .card h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; position: relative; }
  .card p { color: var(--muted); font-size: 13px; line-height: 1.45; position: relative; }
  .emoji { font-size: 40px; margin-bottom: 10px; display: block; position: relative; }
  .badge {
    position: absolute;
    top: 14px; right: 14px;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0, 226, 110, 0.15);
    color: #22e77c;
    border: 1px solid rgba(34, 231, 124, 0.35);
  }
  .card.locked { opacity: 0.75; }
  .card.locked .badge {
    background: rgba(162, 60, 245, 0.15);
    color: #c07bff;
    border-color: rgba(192, 123, 255, 0.35);
  }
  .footer { margin-top: auto; padding-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="logo"><span class="ki">Ki</span><span class="roblox">Roblox</span> 🕹</div>
  <div class="tagline">Игровая площадка — подарок каждому игроку</div>

  <div class="grid">
    <a class="card runner" href="runner/">
      <div class="glow"></div>
      <span class="emoji">🏃</span>
      <span class="badge">ИГРАТЬ</span>
      <h2>Roblox Runner</h2>
      <p>Беги и перепрыгивай кубики! Чем дальше — тем быстрее. Побей свой рекорд.</p>
    </a>

    <div class="card fnf locked" id="fnf-card">
      <div class="glow"></div>
      <span class="emoji">🎤</span>
      <span class="badge">СКОРО</span>
      <h2>FNF Beat Battle</h2>
      <p>Ритм-баттл в стиле Friday Night Funkin'. Лови стрелки в такт музыке!</p>
    </div>
  </div>

  <div class="footer">@KiRoblox — играй прямо в Telegram</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  document.getElementById("fnf-card").addEventListener("click", () => {
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("warning");
    const badge = document.querySelector("#fnf-card .badge");
    badge.textContent = "🔒 СКОРО";
    setTimeout(() => (badge.textContent = "СКОРО"), 1200);
  });
</script>
</body>
</html>
