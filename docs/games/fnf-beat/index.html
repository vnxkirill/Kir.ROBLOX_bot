<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FNF Beat Battle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg1: #12141d;
    --bg2: #241a38;
    --text: #f2f4ff;
    --muted: #8b92b0;
    --accent: #a23cf5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg2), var(--bg1));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }
  #wrap { position: relative; width: 100%; max-width: 420px; height: 100%; max-height: 760px; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(12, 10, 22, 0.8);
    backdrop-filter: blur(5px);
    text-align: center;
    padding: 20px;
    z-index: 5;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 26px; font-weight: 800; }
  #overlay p { color: var(--muted); font-size: 14px; max-width: 320px; line-height: 1.55; }
  #overlay .score-line { font-size: 17px; font-weight: 700; color: var(--accent); }
  button {
    margin-top: 8px;
    font: inherit;
    font-weight: 800;
    font-size: 16px;
    color: #fff;
    background: linear-gradient(135deg, #a23cf5, #6414c9);
    border: none;
    border-radius: 14px;
    padding: 14px 34px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(162, 60, 245, 0.45);
  }
  button:active { transform: scale(0.96); }
  .back {
    position: absolute;
    top: 10px; left: 12px;
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    z-index: 6;
  }
  #botplay {
    position: absolute;
    top: 66px; right: 12px;
    z-index: 6;
    margin: 0;
    font-size: 11px;
    font-weight: 800;
    padding: 7px 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: var(--muted);
    box-shadow: none;
    display: none;
  }
  #botplay.on {
    background: linear-gradient(135deg, #22e77c, #0f9d58);
    border-color: transparent;
    color: #06281a;
    box-shadow: 0 4px 16px rgba(34, 231, 124, 0.4);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <a class="back" href="../">⬅ к играм</a>
  <button id="botplay">🤖 BOT PLAY</button>
  <div id="overlay">
    <h1>🎤 FNF Beat Battle</h1>
    <p>🎹 <b>Beat Battle</b> — классика: лови стрелки в такт, тапай по полосе (клавиатура: стрелки или DFJK).<br><br>
    🌀 <b>Slidenotefication 9</b> — битва с ботом 🤖: 26 нот-букв, жми A–Z на компьютере или тапай в ритм на телефоне.</p>
    <button class="song-btn" data-song="beat">🎹 Beat Battle</button>
    <button class="song-btn" data-song="slide9">🌀 Slidenotefication 9 (мод)</button>
  </div>
</div>

<script>
"use strict";
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const botplayBtn = document.getElementById("botplay");

// ── Песни: classic — 4 стрелки, battle — 26 букв и бот ──────
const SONGS = {
  beat:   { title: "Beat Battle", synth: true, mode: "classic" },
  slide9: { title: "Slidenotefication 9", audio: "songs/slide9.ogg", chart: "songs/slide9_chart.json", mode: "battle" },
};
let currentSong = "beat";
const modCache = {};   // songId -> {buffer, chart}
let modSource = null;  // играющий AudioBufferSourceNode

// логический размер холста (портрет), CSS растягивает
const W = 420, H = 760;
canvas.width = W;
canvas.height = H;

// ── Классика: 4 полосы со стрелками ─────────────────────────
const LANES = 4;
const LANE_W = 76;
const FIELD_W = LANE_W * LANES;
const FIELD_X = (W - FIELD_W) / 2;
const LANE_COLORS = ["#c24bff", "#00c2ff", "#22e77c", "#ff4b6e"]; // ← ↓ ↑ →
const LANE_DIRS = ["left", "down", "up", "right"];

// ── Битва: 26 нот-букв, слева — игрок, справа — бот ─────────
const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const NOTE_SIZE = 36;
const PZONE = { x: 16, w: 178 };   // зона игрока (слева)
const BZONE = { x: 226, w: 178 };  // зона бота (справа)
const SECTION = 3.6;               // сек — куски бота и игрока чередуются

const RECEPTOR_Y = 140;            // линия попадания сверху, ноты летят вверх
const TRAVEL_TIME = 1.2;           // сек от низа до линии

function letterColor(i) { return `hsl(${(i * 137.5) % 360} 85% 62%)`; }
function letterX(zone, i) { return zone.x + (i / 25) * (zone.w - NOTE_SIZE) + NOTE_SIZE / 2; }

// тайминги попаданий, сек (в битве окна чуть шире — букв 26!)
const WINDOWS = {
  classic: { sick: 0.055, good: 0.105, bad: 0.15 },
  battle:  { sick: 0.07,  good: 0.13,  bad: 0.18 },
};

const BPM = 130;
const BEAT = 60 / BPM;
const SONG_BEATS = 128;            // ~59 секунд

let best = Number(localStorage.getItem("fnfbeat_best") || 0);

// ── Состояние ───────────────────────────────────────────────
const state = {
  running: false,
  mode: "classic",
  notes: [],        // classic: {lane,time,...}; battle: {letter,time,side,...}
  score: 0,
  combo: 0,
  maxCombo: 0,
  health: 50,       // 0..100
  hits: { sick: 0, good: 0, bad: 0, miss: 0 },
  rating: null,     // {text, color, until}
  receptorFlash: [0, 0, 0, 0],
  fx: [],           // частицы (битва)
  playerSingUntil: 0,
  botSingUntil: 0,
  songEnd: 0,
  botplay: false,   // авто-игра: все клавиши жмутся сами
};

function win() { return WINDOWS[state.mode]; }

// ── Музыка (WebAudio, всё синтезируется) ────────────────────
let audio = null;
function makeAudio() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const master = ac.createGain();
  master.gain.value = 0.5;
  master.connect(ac.destination);
  // шум для хэтов
  const noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.1, ac.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  return { ac, master, noiseBuf, scheduledUpTo: 0 };
}

function kick(t) {
  const { ac, master } = audio;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.25);
}
function hat(t, open) {
  const { ac, master, noiseBuf } = audio;
  const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  src.buffer = noiseBuf;
  f.type = "highpass"; f.frequency.value = 7000;
  g.gain.setValueAtTime(open ? 0.25 : 0.14, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.18 : 0.05));
  src.connect(f).connect(g).connect(master);
  src.start(t); src.stop(t + 0.2);
}
function bass(t, freq, len) {
  const { ac, master } = audio;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.value = freq;
  f.type = "lowpass"; f.frequency.setValueAtTime(900, t);
  f.frequency.exponentialRampToValueAtTime(280, t + len);
  g.gain.setValueAtTime(0.32, t);
  g.gain.setValueAtTime(0.32, t + len - 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(f).connect(g).connect(master);
  o.start(t); o.stop(t + len + 0.02);
}
function stab(t, freqs) {
  const { ac, master } = audio;
  for (const fr of freqs) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square"; o.frequency.value = fr;
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.18);
  }
}

// басовый грув ля-минор: A1 A1 C2 D2 | A1 A1 E2 D2
const BASS_LINE = [55, 55, 65.4, 73.4, 55, 55, 82.4, 73.4];
const STAB_CHORDS = [[220, 261.6, 329.6], [174.6, 220, 261.6]];

let songStart = 0;
function scheduleMusic() {
  if (audio.scheduledUpTo === Infinity) return;
  const { ac } = audio;
  const until = ac.currentTime + 1.2;
  while (audio.scheduledUpTo < until) {
    const b = audio.scheduledUpTo; // номер восьмушки
    const t = songStart + b * BEAT * 0.5;
    const beatNum = Math.floor(b / 2);
    if (beatNum >= SONG_BEATS) break;
    if (b % 2 === 0) {                       // каждый бит
      kick(t);
      bass(t, BASS_LINE[beatNum % 8], BEAT * 0.45);
      if (beatNum % 2 === 1) stab(t, STAB_CHORDS[(beatNum >> 2) % 2]);
    }
    hat(t, b % 4 === 2);                     // хэты на восьмушках
    audio.scheduledUpTo++;
  }
}

// ── Генерация нот (классика, синт-песня) ────────────────────
function generateNotes() {
  const notes = [];
  let prevLane = -1;
  for (let e = 8; e < SONG_BEATS * 2 - 4; e++) {  // сетка восьмушек
    const progress = e / (SONG_BEATS * 2);
    const onBeat = e % 2 === 0;
    const p = (onBeat ? 0.55 : 0.18) * (0.55 + progress * 0.75);
    if (Math.random() >= p) continue;
    let lane = (Math.random() * LANES) | 0;
    if (lane === prevLane && Math.random() < 0.6) lane = (lane + 1 + ((Math.random() * 3) | 0)) % LANES;
    const time = e * BEAT * 0.5;
    notes.push({ lane, time, hit: false, missed: false });
    // изредка — двойная нота на сильную долю во второй половине
    if (onBeat && progress > 0.5 && Math.random() < 0.12) {
      const lane2 = (lane + 1 + ((Math.random() * 3) | 0)) % LANES;
      notes.push({ lane: lane2, time, hit: false, missed: false });
    }
    prevLane = lane;
  }
  return notes;
}

// битва: раздаём буквы и стороны — куски по SECTION сек чередуются
function decorate(raw) {
  return raw.map((n) => {
    const side = Math.floor(n.time / SECTION) % 2 === 0 ? "bot" : "player";
    const letter = ((Math.floor(n.time * 100) * 31 + (n.lane || 0) * 7) % 26 + 26) % 26;
    return { time: n.time, letter, side, hit: false, missed: false };
  });
}

// ── Старт/финиш ─────────────────────────────────────────────
// Скачиваем трек фоном сразу при открытии страницы (без decode —
// AudioContext можно создавать только после тапа пользователя).
const prefetch = {};  // songId -> Promise<{audioData, chart}>
function prefetchMod(id) {
  if (prefetch[id]) return prefetch[id];
  const song = SONGS[id];
  prefetch[id] = (async () => {
    const [audioRes, chartRes] = await Promise.all([fetch(song.audio), fetch(song.chart)]);
    if (!audioRes.ok || !chartRes.ok) throw new Error("fetch failed");
    // читаем поток по кускам, чтобы показывать проценты
    const total = Number(audioRes.headers.get("Content-Length")) || 0;
    const reader = audioRes.body.getReader();
    const parts = [];
    let got = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value);
      got += value.length;
      if (total) {
        song.progress = Math.round((got / total) * 100);
        const bar = document.getElementById("dlbar");
        if (bar) bar.textContent = `Загрузка ${song.progress}%`;
      }
    }
    const audioData = new Uint8Array(got);
    let off = 0;
    for (const p of parts) { audioData.set(p, off); off += p.length; }
    const chart = await chartRes.json();
    return { audioData: audioData.buffer, chart };
  })();
  prefetch[id].catch(() => { delete prefetch[id]; });  // при ошибке можно повторить
  return prefetch[id];
}
// стартуем скачивание сразу — к нажатию кнопки трек уже на месте
for (const id in SONGS) if (SONGS[id].audio) prefetchMod(id);

// и сразу декодируем: AudioContext до тапа suspended, но decode работает
if (!audio) audio = makeAudio();
for (const id in SONGS) {
  if (!SONGS[id].audio) continue;
  prefetch[id]?.then(async ({ audioData, chart }) => {
    const buffer = await audio.ac.decodeAudioData(audioData.slice(0));
    modCache[id] = { buffer, chart };
    SONGS[id].ready = true;
    markReady(id);
  }).catch(() => {});
}

// на кнопке в меню видно, готов ли трек
const SONG_LABEL = { beat: "🎹 Beat Battle", slide9: "🌀 Slidenotefication 9 (мод)" };
function songBtn(id) {
  const tick = SONGS[id].ready ? " ✓" : "";
  return `<button class="song-btn" data-song="${id}">${SONG_LABEL[id]}${tick}</button>`;
}
function markReady(id) {
  for (const btn of document.querySelectorAll(`.song-btn[data-song="${id}"]`)) {
    if (!btn.textContent.includes("✓")) btn.textContent = SONG_LABEL[id] + " ✓";
  }
}

async function loadMod(id) {
  if (modCache[id]) return modCache[id];
  const { audioData, chart } = await prefetchMod(id);
  const buffer = await audio.ac.decodeAudioData(audioData.slice(0));
  modCache[id] = { buffer, chart };
  return modCache[id];
}

async function start(songId) {
  currentSong = songId || currentSong;
  const song = SONGS[currentSong];
  if (!audio) audio = makeAudio();
  audio.ac.resume();
  if (modSource) { try { modSource.stop(); } catch {} modSource = null; }
  state.mode = song.mode;

  if (song.synth) {
    state.notes = generateNotes();
    songStart = audio.ac.currentTime + 0.8;
    audio.scheduledUpTo = 0;
    state.songEnd = SONG_BEATS * BEAT;
  } else {
    overlay.innerHTML = `<h1>🎧 Загрузка…</h1><p>${song.title}</p>
      <p id="dlbar" style="color:#22e77c;font-weight:800">Загрузка ${song.progress || 0}%</p>`;
    overlay.classList.remove("hidden");
    let mod;
    try {
      mod = await loadMod(currentSong);
    } catch {
      showMenu("Не удалось загрузить трек — проверь интернет и попробуй ещё раз.");
      return;
    }
    // пропускаем длинное интро: старт за 2.5 сек до первой ноты
    const skip = Math.max(0, mod.chart[0][0] - 2.5);
    const raw = mod.chart.map(([time, lane]) => ({ time: time - skip, lane }));
    state.notes = song.mode === "battle"
      ? decorate(raw)
      : raw.map((n) => ({ lane: n.lane, time: n.time, hit: false, missed: false }));
    songStart = audio.ac.currentTime + 0.8;
    audio.scheduledUpTo = Infinity;         // синт-музыку не планируем
    state.songEnd = mod.buffer.duration - skip;
    modSource = audio.ac.createBufferSource();
    modSource.buffer = mod.buffer;
    modSource.connect(audio.master);
    modSource.start(songStart, skip);
  }

  state.score = 0; state.combo = 0; state.maxCombo = 0;
  state.health = 50;
  state.hits = { sick: 0, good: 0, bad: 0, miss: 0 };
  state.rating = null;
  state.fx = [];
  state.receptorFlash = [0, 0, 0, 0];
  state.playerSingUntil = 0;
  state.botSingUntil = 0;
  overlay.classList.add("hidden");
  botplayBtn.style.display = "block";
  botplayBtn.classList.toggle("on", state.botplay);
  state.running = true;
  requestAnimationFrame(loop);
}

function showMenu(subtitle) {
  overlay.innerHTML = `
    <h1>🎤 FNF Beat Battle</h1>
    <p>${subtitle || "Выбери песню:"}</p>
    ${songBtn("beat")}
    ${songBtn("slide9")}`;
  overlay.classList.remove("hidden");
}
overlay.addEventListener("click", (e) => {
  const btn = e.target.closest(".song-btn, #againBtn");
  if (!btn) return;
  start(btn.dataset.song);
});

// 🤖 BOT PLAY: все клавиши жмутся сами (счёт без рекорда)
botplayBtn.addEventListener("click", () => {
  state.botplay = !state.botplay;
  botplayBtn.classList.toggle("on", state.botplay);
});

function songTime() { return audio.ac.currentTime - songStart; }

function finish(won) {
  state.running = false;
  if (modSource) { try { modSource.stop(); } catch {} modSource = null; }
  audio.master.gain.setTargetAtTime(0.0001, audio.ac.currentTime, 0.1);
  setTimeout(() => { if (!state.running) audio.master.gain.value = 0.5; }, 600);
  const total = state.hits.sick + state.hits.good + state.hits.bad + state.hits.miss;
  const acc = total ? Math.round(((state.hits.sick + state.hits.good * 0.7 + state.hits.bad * 0.3) / total) * 100) : 0;
  const final = Math.floor(state.score);
  // в BOT PLAY рекорд не записываем — играл-то бот!
  if (!state.botplay && final > best) { best = final; localStorage.setItem("fnfbeat_best", best); }
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred(won ? "success" : "error");
  botplayBtn.style.display = "none";
  overlay.innerHTML = `
    <h1>${won ? "🏆 Победа!" : "💀 Проигрыш…"}</h1>
    ${state.botplay ? '<p style="color:#22e77c;font-weight:800">🤖 BOT PLAY — рекорд не считается</p>' : ""}
    <div class="score-line">Счёт: ${final} · Рекорд: ${best}</div>
    <p>Точность: ${acc}% · Макс. комбо: ${state.maxCombo}<br>
    Sick ${state.hits.sick} · Good ${state.hits.good} · Bad ${state.hits.bad} · Miss ${state.hits.miss}</p>
    <button id="againBtn" data-song="${currentSong}">Ещё раз</button>
    ${songBtn(currentSong === "beat" ? "slide9" : "beat")}`;
  overlay.classList.remove("hidden");
}

// ── Ввод ────────────────────────────────────────────────────
const KEYMAP = {
  ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3,
  KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3,
};
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (state.mode === "battle") {
    // битва: 26 букв — жми ту, что написана на ноте
    if (/^Key[A-Z]$/.test(e.code)) {
      e.preventDefault();
      pressLetter(ALPHABET.indexOf(e.code[3]));
    }
    return;
  }
  const lane = KEYMAP[e.code];
  if (lane !== undefined) { e.preventDefault(); pressLane(lane); }
});
document.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button, a")) return;
  if (!state.running) return;
  if (state.mode === "battle") return tapHit();  // телефон: тап в ритм
  const rect = canvas.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * W;
  let lane = Math.floor((x - FIELD_X) / LANE_W);
  lane = Math.max(0, Math.min(LANES - 1, lane));
  pressLane(lane);
});

function setRating(text, color) {
  state.rating = { text, color, until: songTime() + 0.5 };
}

function sparkle(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 3;
    state.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 20, max: 20, color });
  }
}

function reward(note, d) {
  note.hit = true;
  state.combo++;
  state.maxCombo = Math.max(state.maxCombo, state.combo);
  const { sick, good } = win();
  let gain, pts;
  if (d <= sick)      { state.hits.sick++; gain = 3;   pts = 350; setRating("SICK!", "#22e77c"); }
  else if (d <= good) { state.hits.good++; gain = 2;   pts = 200; setRating("GOOD", "#00c2ff"); }
  else                { state.hits.bad++;  gain = 0.5; pts = 80;  setRating("BAD", "#ffb020"); }
  state.health = Math.min(100, state.health + gain);
  state.score += pts + state.combo * 2;
  if (state.mode === "battle") {
    state.playerSingUntil = songTime() + 0.28;
    sparkle(letterX(PZONE, note.letter), RECEPTOR_Y, letterColor(note.letter));
  }
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(d <= sick ? "medium" : "light");
}

function penalty() {
  // пустой тап — лёгкий штраф, чтобы не спамили
  state.combo = 0;
  state.health = Math.max(0, state.health - 1.5);
}

// классика: тап/клавиша по полосе
function pressLane(lane) {
  if (!state.running) return;
  state.receptorFlash[lane] = 1;
  const now = songTime();
  let bestNote = null, bestD = Infinity;
  for (const n of state.notes) {
    if (n.lane !== lane || n.hit || n.missed) continue;
    const d = Math.abs(n.time - now);
    if (d < bestD) { bestD = d; bestNote = n; }
  }
  if (!bestNote || bestD > win().bad) return penalty();
  reward(bestNote, bestD);
}

// битва, компьютер: нужна именно буква, написанная на ноте
function pressLetter(letterIdx) {
  if (!state.running) return;
  const now = songTime();
  let bestNote = null, bestD = Infinity;
  for (const n of state.notes) {
    if (n.side !== "player" || n.letter !== letterIdx || n.hit || n.missed) continue;
    const d = Math.abs(n.time - now);
    if (d < bestD) { bestD = d; bestNote = n; }
  }
  if (!bestNote || bestD > win().bad) return penalty();
  reward(bestNote, bestD);
}

// битва, телефон: тап в ритм — засчитывается ближайшая твоя нота
function tapHit() {
  const now = songTime();
  let bestNote = null, bestD = Infinity;
  for (const n of state.notes) {
    if (n.side !== "player" || n.hit || n.missed) continue;
    const d = Math.abs(n.time - now);
    if (d < bestD) { bestD = d; bestNote = n; }
  }
  if (!bestNote || bestD > win().bad) return penalty();
  reward(bestNote, bestD);
}

// ── Классика: отрисовка стрелок ─────────────────────────────
function laneX(lane) { return FIELD_X + lane * LANE_W + LANE_W / 2; }

function drawArrow(x, y, size, dir, fill, stroke, glow) {
  ctx.save();
  ctx.translate(x, y);
  const rot = { left: Math.PI / 2, down: 0, up: Math.PI, right: -Math.PI / 2 }[dir];
  ctx.rotate(rot);
  // стрелка вниз в локальных координатах
  const s = size / 2;
  ctx.beginPath();
  ctx.moveTo(-s * 0.42, -s);
  ctx.lineTo(s * 0.42, -s);
  ctx.lineTo(s * 0.42, 0);
  ctx.lineTo(s * 0.85, 0);
  ctx.lineTo(0, s);
  ctx.lineTo(-s * 0.85, 0);
  ctx.lineTo(-s * 0.42, 0);
  ctx.closePath();
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 18; }
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.restore();
}

function drawClassic(now) {
  // пульс фона на бит
  const beatFrac = ((now / BEAT) % 1 + 1) % 1;
  const pulse = Math.max(0, 1 - beatFrac * 3);
  ctx.fillStyle = `rgba(162, 60, 245, ${0.04 + pulse * 0.05})`;
  ctx.fillRect(0, 0, W, H);

  // разделители полос
  ctx.strokeStyle = "rgba(255,255,255,0.06)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= LANES; i++) {
    const x = FIELD_X + i * LANE_W;
    ctx.beginPath(); ctx.moveTo(x, 60); ctx.lineTo(x, H); ctx.stroke();
  }

  // приёмники
  for (let i = 0; i < LANES; i++) {
    const flash = state.receptorFlash[i];
    drawArrow(laneX(i), RECEPTOR_Y, 54 + flash * 8, LANE_DIRS[i],
      flash > 0.05 ? LANE_COLORS[i] : null,
      flash > 0.05 ? "#ffffff" : "rgba(255,255,255,0.35)",
      flash > 0.05 ? LANE_COLORS[i] : null);
    state.receptorFlash[i] = Math.max(0, flash - 0.08);
  }

  // ноты (летят снизу вверх)
  for (const n of state.notes) {
    if (n.hit || n.missed) continue;
    const dt = n.time - now;
    if (dt > TRAVEL_TIME + 0.1 || dt < -0.25) continue;
    const y = RECEPTOR_Y + (dt / TRAVEL_TIME) * (H - RECEPTOR_Y + 60);
    drawArrow(laneX(n.lane), y, 54, LANE_DIRS[n.lane], LANE_COLORS[n.lane], "rgba(0,0,0,0.4)", LANE_COLORS[n.lane]);
  }

  drawHud(now, FIELD_X, FIELD_W);
}

// ── Битва: сцена, персонажи, ноты-буквы ─────────────────────
function drawStage(now) {
  const beatFrac = ((now / BEAT) % 1 + 1) % 1;
  const pulse = Math.max(0, 1 - beatFrac * 3);

  // дальняя стена с виньеткой
  const g = ctx.createRadialGradient(W / 2, H * 0.35, 60, W / 2, H * 0.55, 520);
  g.addColorStop(0, `rgba(162, 60, 245, ${0.10 + pulse * 0.06})`);
  g.addColorStop(1, "rgba(10, 8, 20, 0.55)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // прожекторы на артистов
  ctx.globalAlpha = 0.10 + pulse * 0.08;
  ctx.fillStyle = "#c24bff";
  ctx.beginPath();
  ctx.moveTo(70, 0); ctx.lineTo(150, 0);
  ctx.lineTo(160, H - 130); ctx.lineTo(40, H - 130);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#00c2ff";
  ctx.beginPath();
  ctx.moveTo(W - 150, 0); ctx.lineTo(W - 70, 0);
  ctx.lineTo(W - 40, H - 130); ctx.lineTo(W - 160, H - 130);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  // сцена-пол
  ctx.fillStyle = "#191d30";
  ctx.fillRect(0, H - 130, W, 130);
  ctx.strokeStyle = "rgba(255,255,255,0.10)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H - 130); ctx.lineTo(W, H - 130); ctx.stroke();

  // колонки по краям, дёргаются на бит
  const sp = 1 + pulse * 0.05;
  for (const sx of [8, W - 44]) {
    ctx.save();
    ctx.translate(sx + 18, H - 74);
    ctx.scale(sp, sp);
    ctx.fillStyle = "#0e1120";
    ctx.beginPath(); ctx.roundRect(-18, -50, 36, 92, 6); ctx.fill();
    ctx.fillStyle = "#232840";
    ctx.beginPath(); ctx.arc(0, -22, 11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 16, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(162,60,245,${0.35 + pulse * 0.5})`;
    ctx.beginPath(); ctx.arc(0, 16, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // толпа-силуэты
  ctx.fillStyle = "#0b0d16";
  for (let i = 0; i < 11; i++) {
    const x = 20 + i * 38 + (i % 2) * 8;
    const bob = Math.sin(now * 4 + i) * 3 - pulse * 4;
    ctx.beginPath();
    ctx.arc(x, H - 16 + bob, 13, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x - 13, H - 16 + bob, 26, 20);
  }
}

function drawNoob(cx, cy, sing, pulse) {
  // игрок — роблокс-нуб слева
  const s = 1 + pulse * 0.04;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  const arm = sing ? -14 : 0;
  ctx.fillStyle = "#2d4fd6";                       // ноги
  ctx.beginPath(); ctx.roundRect(-16, 22, 13, 22, 4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(3, 22, 13, 22, 4); ctx.fill();
  ctx.fillStyle = "#22c55e";                       // торс
  ctx.beginPath(); ctx.roundRect(-20, -4, 40, 28, 6); ctx.fill();
  ctx.fillStyle = "#ffd23e";                       // руки
  ctx.beginPath(); ctx.roundRect(-30, -2 + arm, 10, 24, 4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(20, -2 + arm, 10, 24, 4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-15, -32, 30, 28, 8); ctx.fill();  // голова
  ctx.fillStyle = "#1a1a1a";                       // лицо
  ctx.beginPath();
  ctx.arc(-7, -21, 2.6, 0, Math.PI * 2);
  ctx.arc(7, -21, 2.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 2;
  ctx.beginPath();
  if (sing) { ctx.arc(0, -13, 5, 0, Math.PI * 2); }               // рот открыт — поёт
  else { ctx.arc(0, -16, 6, 0.15 * Math.PI, 0.85 * Math.PI); }    // улыбка
  ctx.stroke();
  // микрофон
  ctx.fillStyle = "#8b92b0";
  ctx.beginPath(); ctx.roundRect(26, -12 + arm, 4, 16, 2); ctx.fill();
  ctx.fillStyle = "#454c66";
  ctx.beginPath(); ctx.arc(28, -16 + arm, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBot(cx, cy, sing, pulse) {
  // соперник — робот справа
  const s = 1 + pulse * 0.04;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  const arm = sing ? -14 : 0;
  ctx.fillStyle = "#3a4161";                       // ноги
  ctx.beginPath(); ctx.roundRect(-16, 22, 13, 22, 4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(3, 22, 13, 22, 4); ctx.fill();
  ctx.fillStyle = "#565f8a";                       // корпус
  ctx.beginPath(); ctx.roundRect(-20, -4, 40, 28, 8); ctx.fill();
  ctx.fillStyle = `rgba(162,60,245,${sing ? 0.9 : 0.45})`;        // сердечник
  ctx.beginPath(); ctx.arc(0, 10, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#565f8a";                       // руки
  ctx.beginPath(); ctx.roundRect(-30, -2 + arm, 10, 24, 4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(20, -2, 10, 24, 4); ctx.fill();
  // голова-экран
  ctx.fillStyle = "#20263f";
  ctx.beginPath(); ctx.roundRect(-17, -34, 34, 30, 8); ctx.fill();
  ctx.strokeStyle = "#767ea6"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(-17, -34, 34, 30, 8); ctx.stroke();
  // антенна
  ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(0, -44); ctx.stroke();
  ctx.fillStyle = sing ? "#22e77c" : "#a23cf5";
  ctx.beginPath(); ctx.arc(0, -46, 3.5, 0, Math.PI * 2); ctx.fill();
  // глаза-экран
  ctx.fillStyle = sing ? "#22e77c" : "#00c2ff";
  if (sing) {
    ctx.font = "800 16px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("♪ ♪", 0, -14);
  } else {
    ctx.beginPath();
    ctx.roundRect(-10, -24, 8, 4, 2);
    ctx.roundRect(2, -24, 8, 4, 2);
    ctx.fill();
  }
  // микрофон в левой руке
  ctx.fillStyle = "#8b92b0";
  ctx.beginPath(); ctx.roundRect(-30, -12 + arm, 4, 16, 2); ctx.fill();
  ctx.fillStyle = "#454c66";
  ctx.beginPath(); ctx.arc(-28, -16 + arm, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawLetterNote(n, y) {
  const zone = n.side === "player" ? PZONE : BZONE;
  const x = letterX(zone, n.letter);
  const color = letterColor(n.letter);
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x - NOTE_SIZE / 2, y - NOTE_SIZE / 2, NOTE_SIZE, NOTE_SIZE, 9);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.font = "800 20px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(ALPHABET[n.letter], x, y + 1);
  ctx.restore();
  ctx.textBaseline = "alphabetic";
}

function drawBattle(now) {
  drawStage(now);

  const beatFrac = ((now / BEAT) % 1 + 1) % 1;
  const pulse = Math.max(0, 1 - beatFrac * 3);

  // персонажи на сцене
  drawNoob(105, H - 185, now < state.playerSingUntil, pulse);
  drawBot(315, H - 185, now < state.botSingUntil, pulse);

  // линии попадания
  for (const [zone, label, active] of [[PZONE, "ТЫ", now < state.playerSingUntil], [BZONE, "🤖 БОТ", now < state.botSingUntil]]) {
    ctx.strokeStyle = active ? "rgba(255,255,255,0.85)" : "rgba(255,255,255,0.28)";
    ctx.lineWidth = active ? 4 : 3;
    ctx.beginPath();
    ctx.moveTo(zone.x, RECEPTOR_Y);
    ctx.lineTo(zone.x + zone.w, RECEPTOR_Y);
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = "800 12px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(label, zone.x + zone.w / 2, RECEPTOR_Y - 14);
  }

  // ноты-буквы
  for (const n of state.notes) {
    if (n.hit || n.missed) continue;
    const dt = n.time - now;
    if (dt > TRAVEL_TIME + 0.1 || dt < -0.25) continue;
    const y = RECEPTOR_Y + (dt / TRAVEL_TIME) * (H - RECEPTOR_Y - 160);
    drawLetterNote(n, y);
  }

  // частицы
  for (const p of state.fx) {
    ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
    p.x += p.vx; p.y += p.vy; p.life--;
  }
  ctx.globalAlpha = 1;
  state.fx = state.fx.filter((p) => p.life > 0);

  drawHud(now, 16, W - 32);
}

// ── Общий HUD: здоровье, счёт, комбо, рейтинг ───────────────
function drawHud(now, hbX, hbW) {
  const hbY = 44;
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.beginPath(); ctx.roundRect(hbX, hbY, hbW, 10, 5); ctx.fill();
  const hw = (state.health / 100) * hbW;
  ctx.fillStyle = state.health > 25 ? "#22e77c" : "#ff4b6e";
  ctx.beginPath(); ctx.roundRect(hbX, hbY, Math.max(10, hw), 10, 5); ctx.fill();

  ctx.textAlign = "center";
  ctx.fillStyle = "#f2f4ff";
  ctx.font = "800 22px system-ui, sans-serif";
  ctx.fillText(Math.floor(state.score), W / 2, 30);
  ctx.font = "700 12px system-ui, sans-serif";
  ctx.fillStyle = "#8b92b0";
  ctx.textAlign = "right";
  ctx.fillText("🏆 " + best, W - 14, 28);

  if (state.combo >= 3) {
    ctx.textAlign = "center";
    ctx.font = "800 30px system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillText(state.combo + "×", W / 2, H * 0.44);
  }
  if (state.rating && now < state.rating.until) {
    const a = Math.min(1, (state.rating.until - now) / 0.35);
    ctx.globalAlpha = a;
    ctx.textAlign = "center";
    ctx.font = "800 26px system-ui, sans-serif";
    ctx.fillStyle = state.rating.color;
    ctx.fillText(state.rating.text, W / 2, H * 0.38);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  const now = songTime();
  ctx.clearRect(0, 0, W, H);
  if (state.mode === "battle") drawBattle(now);
  else drawClassic(now);
}

// ── Цикл ────────────────────────────────────────────────────
function loop() {
  if (!state.running) return;
  scheduleMusic();
  const now = songTime();

  // 🤖 BOT PLAY: сам жмёт нужную клавишу, когда нота у линии
  if (state.botplay) {
    for (const n of state.notes) {
      if (n.hit || n.missed || n.side === "bot" || n.time - now > 0.02) continue;
      if (state.mode === "battle") pressLetter(n.letter);
      else pressLane(n.lane);
    }
  }

  for (const n of state.notes) {
    if (n.hit || n.missed) continue;
    if (state.mode === "battle" && n.side === "bot") {
      // бот отыгрывает свои ноты сам
      if (now >= n.time) {
        n.hit = true;
        state.botSingUntil = now + 0.28;
        sparkle(letterX(BZONE, n.letter), RECEPTOR_Y, letterColor(n.letter));
      }
    } else if (now - n.time > win().bad) {
      n.missed = true;
      state.hits.miss++;
      state.combo = 0;
      state.health = Math.max(0, state.health - 7);
      setRating("MISS", "#ff4b6e");
    }
  }

  if (state.health <= 0) return finish(false);
  if (now > state.songEnd + 1) return finish(true);

  draw();
  requestAnimationFrame(loop);
}

// пауза при сворачивании
document.addEventListener("visibilitychange", () => {
  if (document.hidden && audio && state.running) audio.ac.suspend();
  else if (audio && state.running) { audio.ac.resume(); requestAnimationFrame(loop); }
});
</script>
