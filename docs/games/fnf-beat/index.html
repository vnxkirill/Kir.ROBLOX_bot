<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FNF Beat Battle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg1: #12141d;
    --bg2: #241a38;
    --text: #f2f4ff;
    --muted: #8b92b0;
    --accent: #a23cf5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg2), var(--bg1));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }
  #wrap { position: relative; width: 100%; max-width: 420px; height: 100%; max-height: 760px; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(12, 10, 22, 0.8);
    backdrop-filter: blur(5px);
    text-align: center;
    padding: 20px;
    z-index: 5;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 26px; font-weight: 800; }
  #overlay p { color: var(--muted); font-size: 14px; max-width: 300px; line-height: 1.55; }
  #overlay .score-line { font-size: 17px; font-weight: 700; color: var(--accent); }
  button {
    margin-top: 8px;
    font: inherit;
    font-weight: 800;
    font-size: 16px;
    color: #fff;
    background: linear-gradient(135deg, #a23cf5, #6414c9);
    border: none;
    border-radius: 14px;
    padding: 14px 34px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(162, 60, 245, 0.45);
  }
  button:active { transform: scale(0.96); }
  .back {
    position: absolute;
    top: 10px; left: 12px;
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    z-index: 6;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <a class="back" href="../">⬅ к играм</a>
  <div id="overlay">
    <h1>🎤 FNF Beat Battle</h1>
    <p>Лови стрелки в такт музыке! Тапай по своей полосе, когда стрелка долетает до контура сверху.<br><br>
    На клавиатуре — стрелки или DFJK.</p>
    <button class="song-btn" data-song="beat">🎹 Beat Battle</button>
    <button class="song-btn" data-song="slide9">🌀 Slidenotefication 9 (мод)</button>
  </div>
</div>

<script>
"use strict";
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

// ── Песни: синт-битва и треки из модов ──────────────────────
const SONGS = {
  beat:   { title: "Beat Battle", synth: true },
  slide9: { title: "Slidenotefication 9", audio: "songs/slide9.ogg", chart: "songs/slide9_chart.json" },
};
let currentSong = "beat";
const modCache = {};   // songId -> {buffer, chart}
let modSource = null;  // играющий AudioBufferSourceNode

// логический размер холста (портрет), CSS растягивает
const W = 420, H = 760;
canvas.width = W;
canvas.height = H;

const LANES = 4;
const LANE_W = 76;
const FIELD_W = LANE_W * LANES;
const FIELD_X = (W - FIELD_W) / 2;
const RECEPTOR_Y = 130;           // контуры-приёмники сверху, ноты летят вверх
const TRAVEL_TIME = 1.1;          // сек от низа до приёмника
const LANE_COLORS = ["#c24bff", "#00c2ff", "#22e77c", "#ff4b6e"]; // ← ↓ ↑ →
const LANE_DIRS = ["left", "down", "up", "right"];

// тайминги попаданий, сек
const SICK = 0.055, GOOD = 0.105, BAD = 0.15;

const BPM = 130;
const BEAT = 60 / BPM;
const SONG_BEATS = 128;           // ~59 секунд

let best = Number(localStorage.getItem("fnfbeat_best") || 0);

// ── Состояние ───────────────────────────────────────────────
const state = {
  running: false,
  notes: [],        // {lane, time, hit, missed}
  score: 0,
  combo: 0,
  maxCombo: 0,
  health: 50,       // 0..100
  hits: { sick: 0, good: 0, bad: 0, miss: 0 },
  rating: null,     // {text, color, until}
  receptorFlash: [0, 0, 0, 0],
  songEnd: 0,
  beatPulse: 0,
};

// ── Музыка (WebAudio, всё синтезируется) ────────────────────
let audio = null;
function makeAudio() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const master = ac.createGain();
  master.gain.value = 0.5;
  master.connect(ac.destination);
  // шум для хэтов
  const noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.1, ac.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  return { ac, master, noiseBuf, scheduledUpTo: 0 };
}

function kick(t) {
  const { ac, master } = audio;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.12);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.25);
}
function hat(t, open) {
  const { ac, master, noiseBuf } = audio;
  const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  src.buffer = noiseBuf;
  f.type = "highpass"; f.frequency.value = 7000;
  g.gain.setValueAtTime(open ? 0.25 : 0.14, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.18 : 0.05));
  src.connect(f).connect(g).connect(master);
  src.start(t); src.stop(t + 0.2);
}
function bass(t, freq, len) {
  const { ac, master } = audio;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.value = freq;
  f.type = "lowpass"; f.frequency.setValueAtTime(900, t);
  f.frequency.exponentialRampToValueAtTime(280, t + len);
  g.gain.setValueAtTime(0.32, t);
  g.gain.setValueAtTime(0.32, t + len - 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(f).connect(g).connect(master);
  o.start(t); o.stop(t + len + 0.02);
}
function stab(t, freqs) {
  const { ac, master } = audio;
  for (const fr of freqs) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square"; o.frequency.value = fr;
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.18);
  }
}

// басовый грув ля-минор: A1 A1 C2 D2 | A1 A1 E2 D2
const BASS_LINE = [55, 55, 65.4, 73.4, 55, 55, 82.4, 73.4];
const STAB_CHORDS = [[220, 261.6, 329.6], [174.6, 220, 261.6]];

let songStart = 0;
function scheduleMusic() {
  // планируем звук на 1.2 сек вперёд от текущего audio-времени
  const { ac } = audio;
  const until = ac.currentTime + 1.2;
  while (audio.scheduledUpTo < until) {
    const b = audio.scheduledUpTo; // номер восьмушки
    const t = songStart + b * BEAT * 0.5;
    const beatNum = Math.floor(b / 2);
    if (beatNum >= SONG_BEATS) break;
    if (b % 2 === 0) {                       // каждый бит
      kick(t);
      bass(t, BASS_LINE[beatNum % 8], BEAT * 0.45);
      if (beatNum % 2 === 1) stab(t, STAB_CHORDS[(beatNum >> 2) % 2]);
    }
    hat(t, b % 4 === 2);                     // хэты на восьмушках
    audio.scheduledUpTo++;
  }
}

// ── Генерация нот ───────────────────────────────────────────
function generateNotes() {
  const notes = [];
  let prevLane = -1;
  for (let e = 8; e < SONG_BEATS * 2 - 4; e++) {  // сетка восьмушек
    const progress = e / (SONG_BEATS * 2);
    const onBeat = e % 2 === 0;
    let p = (onBeat ? 0.55 : 0.18) * (0.55 + progress * 0.75);
    if (Math.random() >= p) continue;
    let lane = (Math.random() * LANES) | 0;
    if (lane === prevLane && Math.random() < 0.6) lane = (lane + 1 + ((Math.random() * 3) | 0)) % LANES;
    const time = e * BEAT * 0.5;
    notes.push({ lane, time, hit: false, missed: false });
    // изредка — двойная нота на сильную долю во второй половине
    if (onBeat && progress > 0.5 && Math.random() < 0.12) {
      const lane2 = (lane + 1 + ((Math.random() * 3) | 0)) % LANES;
      notes.push({ lane: lane2, time, hit: false, missed: false });
    }
    prevLane = lane;
  }
  return notes;
}

// ── Старт/финиш ─────────────────────────────────────────────
async function loadMod(id) {
  if (modCache[id]) return modCache[id];
  const song = SONGS[id];
  const [audioRes, chartRes] = await Promise.all([fetch(song.audio), fetch(song.chart)]);
  const [audioData, chart] = await Promise.all([audioRes.arrayBuffer(), chartRes.json()]);
  const buffer = await audio.ac.decodeAudioData(audioData);
  modCache[id] = { buffer, chart };
  return modCache[id];
}

async function start(songId) {
  currentSong = songId || currentSong;
  const song = SONGS[currentSong];
  if (!audio) audio = makeAudio();
  audio.ac.resume();
  if (modSource) { try { modSource.stop(); } catch {} modSource = null; }

  if (song.synth) {
    state.notes = generateNotes();
    songStart = audio.ac.currentTime + 0.8;
    audio.scheduledUpTo = 0;
    state.songEnd = SONG_BEATS * BEAT;
  } else {
    overlay.innerHTML = `<h1>🎧 Загрузка…</h1><p>${song.title}</p>`;
    overlay.classList.remove("hidden");
    let mod;
    try {
      mod = await loadMod(currentSong);
    } catch {
      showMenu("Не удалось загрузить трек — проверь интернет и попробуй ещё раз.");
      return;
    }
    // пропускаем длинное интро: старт за 2.5 сек до первой ноты
    const skip = Math.max(0, mod.chart[0][0] - 2.5);
    state.notes = mod.chart.map(([time, lane]) => ({ lane, time: time - skip, hit: false, missed: false }));
    songStart = audio.ac.currentTime + 0.8;
    audio.scheduledUpTo = Infinity;         // синт-музыку не планируем
    state.songEnd = mod.buffer.duration - skip;
    modSource = audio.ac.createBufferSource();
    modSource.buffer = mod.buffer;
    modSource.connect(audio.master);
    modSource.start(songStart, skip);
  }

  state.score = 0; state.combo = 0; state.maxCombo = 0;
  state.health = 50;
  state.hits = { sick: 0, good: 0, bad: 0, miss: 0 };
  state.rating = null;
  overlay.classList.add("hidden");
  state.running = true;
  requestAnimationFrame(loop);
}

function showMenu(subtitle) {
  overlay.innerHTML = `
    <h1>🎤 FNF Beat Battle</h1>
    <p>${subtitle || "Выбери песню:"}</p>
    <button class="song-btn" data-song="beat">🎹 Beat Battle</button>
    <button class="song-btn" data-song="slide9">🌀 Slidenotefication 9 (мод)</button>`;
  overlay.classList.remove("hidden");
}
overlay.addEventListener("click", (e) => {
  const btn = e.target.closest(".song-btn, #againBtn");
  if (!btn) return;
  start(btn.dataset.song);
});

function songTime() { return audio.ac.currentTime - songStart; }

function finish(won) {
  state.running = false;
  if (modSource) { try { modSource.stop(); } catch {} modSource = null; }
  audio.master.gain.setTargetAtTime(0.0001, audio.ac.currentTime, 0.1);
  setTimeout(() => { if (!state.running) audio.master.gain.value = 0.5; }, 600);
  const total = state.hits.sick + state.hits.good + state.hits.bad + state.hits.miss;
  const acc = total ? Math.round(((state.hits.sick + state.hits.good * 0.7 + state.hits.bad * 0.3) / total) * 100) : 0;
  const final = Math.floor(state.score);
  if (final > best) { best = final; localStorage.setItem("fnfbeat_best", best); }
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred(won ? "success" : "error");
  overlay.innerHTML = `
    <h1>${won ? "🏆 Победа!" : "💀 Проигрыш…"}</h1>
    <div class="score-line">Счёт: ${final} · Рекорд: ${best}</div>
    <p>Точность: ${acc}% · Макс. комбо: ${state.maxCombo}<br>
    Sick ${state.hits.sick} · Good ${state.hits.good} · Bad ${state.hits.bad} · Miss ${state.hits.miss}</p>
    <button id="againBtn" data-song="${currentSong}">Ещё раз</button>
    <button class="song-btn" data-song="${currentSong === "beat" ? "slide9" : "beat"}">
      ${currentSong === "beat" ? "🌀 Slidenotefication 9 (мод)" : "🎹 Beat Battle"}</button>`;
  overlay.classList.remove("hidden");
}

// ── Ввод ────────────────────────────────────────────────────
const KEYMAP = {
  ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3,
  KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3,
};
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  const lane = KEYMAP[e.code];
  if (lane !== undefined) { e.preventDefault(); press(lane); }
});
document.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button, a")) return;
  if (!state.running) return;
  const rect = canvas.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * W;
  let lane = Math.floor((x - FIELD_X) / LANE_W);
  lane = Math.max(0, Math.min(LANES - 1, lane));
  press(lane);
});

function setRating(text, color) {
  state.rating = { text, color, until: songTime() + 0.5 };
}

function press(lane) {
  if (!state.running) return;
  state.receptorFlash[lane] = 1;
  const now = songTime();
  let bestNote = null, bestD = Infinity;
  for (const n of state.notes) {
    if (n.lane !== lane || n.hit || n.missed) continue;
    const d = Math.abs(n.time - now);
    if (d < bestD) { bestD = d; bestNote = n; }
  }
  if (!bestNote || bestD > BAD) {
    // пустой тап — лёгкий штраф, чтобы не спамили
    state.combo = 0;
    state.health = Math.max(0, state.health - 1.5);
    return;
  }
  bestNote.hit = true;
  state.combo++;
  state.maxCombo = Math.max(state.maxCombo, state.combo);
  let gain, pts;
  if (bestD <= SICK)      { state.hits.sick++; gain = 3;   pts = 350; setRating("SICK!", "#22e77c"); }
  else if (bestD <= GOOD) { state.hits.good++; gain = 2;   pts = 200; setRating("GOOD", "#00c2ff"); }
  else                    { state.hits.bad++;  gain = 0.5; pts = 80;  setRating("BAD", "#ffb020"); }
  state.health = Math.min(100, state.health + gain);
  state.score += pts + state.combo * 2;
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(bestD <= SICK ? "medium" : "light");
}

// ── Отрисовка ───────────────────────────────────────────────
function laneX(lane) { return FIELD_X + lane * LANE_W + LANE_W / 2; }

function drawArrow(x, y, size, dir, fill, stroke, glow) {
  ctx.save();
  ctx.translate(x, y);
  const rot = { left: Math.PI / 2, down: 0, up: Math.PI, right: -Math.PI / 2 }[dir];
  ctx.rotate(rot);
  // стрелка вниз в локальных координатах
  const s = size / 2;
  ctx.beginPath();
  ctx.moveTo(-s * 0.42, -s);
  ctx.lineTo(s * 0.42, -s);
  ctx.lineTo(s * 0.42, 0);
  ctx.lineTo(s * 0.85, 0);
  ctx.lineTo(0, s);
  ctx.lineTo(-s * 0.85, 0);
  ctx.lineTo(-s * 0.42, 0);
  ctx.closePath();
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 18; }
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.restore();
}

function draw() {
  const now = songTime();
  ctx.clearRect(0, 0, W, H);

  // пульс фона на бит
  const beatFrac = ((now / BEAT) % 1 + 1) % 1;
  const pulse = Math.max(0, 1 - beatFrac * 3);
  ctx.fillStyle = `rgba(162, 60, 245, ${0.04 + pulse * 0.05})`;
  ctx.fillRect(0, 0, W, H);

  // разделители полос
  ctx.strokeStyle = "rgba(255,255,255,0.06)";
  ctx.lineWidth = 1;
  for (let i = 0; i <= LANES; i++) {
    const x = FIELD_X + i * LANE_W;
    ctx.beginPath(); ctx.moveTo(x, 60); ctx.lineTo(x, H); ctx.stroke();
  }

  // приёмники
  for (let i = 0; i < LANES; i++) {
    const flash = state.receptorFlash[i];
    drawArrow(laneX(i), RECEPTOR_Y, 54 + flash * 8, LANE_DIRS[i],
      flash > 0.05 ? LANE_COLORS[i] : null,
      flash > 0.05 ? "#ffffff" : "rgba(255,255,255,0.35)",
      flash > 0.05 ? LANE_COLORS[i] : null);
    state.receptorFlash[i] = Math.max(0, flash - 0.08);
  }

  // ноты (летят снизу вверх)
  for (const n of state.notes) {
    if (n.hit || n.missed) continue;
    const dt = n.time - now;
    if (dt > TRAVEL_TIME + 0.1 || dt < -0.25) continue;
    const y = RECEPTOR_Y + (dt / TRAVEL_TIME) * (H - RECEPTOR_Y + 60);
    drawArrow(laneX(n.lane), y, 54, LANE_DIRS[n.lane], LANE_COLORS[n.lane], "rgba(0,0,0,0.4)", LANE_COLORS[n.lane]);
  }

  // здоровье
  const hbW = FIELD_W, hbX = FIELD_X, hbY = 44;
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.beginPath(); ctx.roundRect(hbX, hbY, hbW, 10, 5); ctx.fill();
  const hw = (state.health / 100) * hbW;
  ctx.fillStyle = state.health > 25 ? "#22e77c" : "#ff4b6e";
  ctx.beginPath(); ctx.roundRect(hbX, hbY, Math.max(10, hw), 10, 5); ctx.fill();

  // счёт и комбо
  ctx.textAlign = "center";
  ctx.fillStyle = "#f2f4ff";
  ctx.font = "800 22px system-ui, sans-serif";
  ctx.fillText(Math.floor(state.score), W / 2, 30);
  ctx.font = "700 12px system-ui, sans-serif";
  ctx.fillStyle = "#8b92b0";
  ctx.textAlign = "right";
  ctx.fillText("🏆 " + best, W - 14, 28);

  if (state.combo >= 3) {
    ctx.textAlign = "center";
    ctx.font = "800 30px system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillText(state.combo + "×", W / 2, H * 0.46);
  }
  if (state.rating && now < state.rating.until) {
    const a = Math.min(1, (state.rating.until - now) / 0.35);
    ctx.globalAlpha = a;
    ctx.textAlign = "center";
    ctx.font = "800 26px system-ui, sans-serif";
    ctx.fillStyle = state.rating.color;
    ctx.fillText(state.rating.text, W / 2, H * 0.40);
    ctx.globalAlpha = 1;
  }
}

// ── Цикл ────────────────────────────────────────────────────
function loop() {
  if (!state.running) return;
  scheduleMusic();
  const now = songTime();

  // просроченные ноты
  for (const n of state.notes) {
    if (!n.hit && !n.missed && now - n.time > BAD) {
      n.missed = true;
      state.hits.miss++;
      state.combo = 0;
      state.health = Math.max(0, state.health - 7);
      setRating("MISS", "#ff4b6e");
    }
  }

  if (state.health <= 0) return finish(false);
  if (now > state.songEnd + 1) return finish(true);

  draw();
  requestAnimationFrame(loop);
}

// пауза при сворачивании
document.addEventListener("visibilitychange", () => {
  if (document.hidden && audio && state.running) audio.ac.suspend();
  else if (audio && state.running) { audio.ac.resume(); requestAnimationFrame(loop); }
});
</script>
</body>
</html>
